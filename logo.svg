<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="Lockout Reporter">
  <title>Lockout Reporter</title>
  <!-- Mark: lock + death-spiral -->
  <g transform="translate(8,8)">
    <rect width="80" height="80" rx="18" fill="#12110e"/>
    <!-- spiral (bot loop) -->
    <path d="M40 22
      a14 14 0 1 1 -10 24
      a10 10 0 1 1 8 16
      a6 6 0 1 1 -4 8"
      fill="none" stroke="#e3943a" stroke-width="3.2" stroke-linecap="round"/>
    <!-- lock body -->
    <rect x="28" y="48" width="24" height="18" rx="3.5" fill="none" stroke="#f4f1ea" stroke-width="3"/>
    <!-- open shackle (locked out) -->
    <path d="M33 48 V40 a7 7 0 0 1 14 0" fill="none" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="56" r="2.2" fill="#e3943a"/>
  </g>
  <!-- Wordmark -->
  <text x="108" y="42" font-family="Palatino, 'Iowan Old Style', Georgia, serif" font-size="34" font-weight="500" fill="#f4f1ea">Lockout</text>
  <text x="108" y="74" font-family="Palatino, 'Iowan Old Style', Georgia, serif" font-size="34" font-weight="500" fill="#e3943a">Reporter</text>
</svg>
